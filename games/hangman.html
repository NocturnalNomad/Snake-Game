<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Hangman — Nocturnal Nomad</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/cursor.css"/>
  <style>
    body { display:flex; flex-direction:column; align-items:center; }
    .hangman-wrap { max-width:600px; width:100%; margin-top:20px; }

    /* SVG gallows */
    #gallows { display:block; margin:0 auto 10px; }
    .gallows-part { stroke:#00ffff; stroke-width:3; stroke-linecap:round; fill:none; transition: opacity 0.3s; opacity:0; }
    .gallows-base { stroke:rgba(0,255,255,0.3); opacity:1; }
    .gallows-part.show { opacity:1; }

    .category-badge {
      text-align:center;
      font-family:'Orbitron',monospace;
      font-size:0.55rem;
      letter-spacing:4px;
      color:var(--magenta);
      text-transform:uppercase;
      margin-bottom:8px;
    }

    .word-display {
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-bottom:24px;
      min-height:52px;
    }

    .letter-slot {
      width:36px;
      border-bottom:2px solid rgba(0,255,255,0.4);
      height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:'Orbitron',monospace;
      font-size:1.3rem;
      font-weight:700;
      color:var(--cyan);
      text-shadow:0 0 10px var(--cyan);
      transition:all 0.2s;
    }

    .letter-slot.space { border-bottom:none; width:16px; }

    /* Letter grid */
    .alpha-grid {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      justify-content:center;
      margin-bottom:20px;
    }

    .alpha-btn {
      width:40px; height:40px;
      background:var(--card-bg);
      border:1px solid var(--card-border);
      border-radius:6px;
      font-family:'Orbitron',monospace;
      font-size:0.75rem;
      font-weight:700;
      color:#fff;
      cursor:none;
      transition:all 0.2s;
    }
    .alpha-btn:hover:not(:disabled) { border-color:var(--cyan); color:var(--cyan); text-shadow:0 0 8px var(--cyan); }
    .alpha-btn.correct { background:rgba(0,255,136,0.1); border-color:var(--green); color:var(--green); }
    .alpha-btn.wrong   { background:rgba(255,0,80,0.08); border-color:rgba(255,0,80,0.3); color:rgba(255,0,80,0.4); }
    .alpha-btn:disabled { cursor:none; }

    .lives-bar {
      display:flex;
      gap:6px;
      justify-content:center;
      margin-bottom:16px;
    }
    .life-dot {
      width:10px; height:10px;
      border-radius:50%;
      background:var(--cyan);
      box-shadow:0 0 6px var(--cyan);
      transition:all 0.3s;
    }
    .life-dot.lost { background:rgba(255,0,80,0.3); box-shadow:none; }

    .hint-text {
      text-align:center;
      font-size:0.8rem;
      color:var(--dim);
      letter-spacing:1px;
      margin-bottom:16px;
      min-height:20px;
    }

    .status-msg {
      text-align:center;
      font-family:'Orbitron',monospace;
      font-size:1rem;
      letter-spacing:3px;
      min-height:28px;
      margin-bottom:12px;
    }
    .status-msg.win  { color:var(--green); text-shadow:0 0 16px var(--green); }
    .status-msg.lose { color:#ff3366; text-shadow:0 0 16px #ff3366; }

    .cat-row { display:flex; gap:8px; justify-content:center; margin-bottom:20px; flex-wrap:wrap; }
  </style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo">NOCTURNAL<span style="color:#fff;opacity:0.4">_</span>NOMAD</a>
  <ul class="nav-links">
    <li><a href="../index.html">Games</a></li>
    <li><a href="../projects.html">Projects</a></li>
    <li><a href="../contact.html">Contact</a></li>
  </ul>
</nav>

<div class="game-page">
  <div class="hangman-wrap">

    <div style="text-align:center;margin-bottom:16px;">
      <div class="section-heading" style="font-size:1.6rem;">HANG<span>MAN</span></div>
    </div>

    <div class="cat-row">
      <button class="btn" onclick="newGame('tech')">TECH</button>
      <button class="btn" onclick="newGame('animals')">ANIMALS</button>
      <button class="btn" onclick="newGame('space')">SPACE</button>
      <button class="btn" onclick="newGame('random')">RANDOM</button>
    </div>

    <!-- Gallows SVG -->
    <svg id="gallows" width="160" height="160" viewBox="0 0 160 160">
      <!-- Base structure (always visible) -->
      <line class="gallows-base" x1="10" y1="150" x2="150" y2="150"/>
      <line class="gallows-base" x1="40" y1="150" x2="40" y2="10"/>
      <line class="gallows-base" x1="40" y1="10"  x2="110" y2="10"/>
      <line class="gallows-base" x1="110" y1="10"  x2="110" y2="30"/>
      <!-- Body parts (revealed on wrong guesses) -->
      <circle class="gallows-part" id="p0" cx="110" cy="45" r="15"/>
      <line   class="gallows-part" id="p1" x1="110" y1="60" x2="110" y2="100"/>
      <line   class="gallows-part" id="p2" x1="110" y1="70" x2="88"  y2="88"/>
      <line   class="gallows-part" id="p3" x1="110" y1="70" x2="132" y2="88"/>
      <line   class="gallows-part" id="p4" x1="110" y1="100" x2="88" y2="130"/>
      <line   class="gallows-part" id="p5" x1="110" y1="100" x2="132" y2="130"/>
    </svg>

    <div class="category-badge" id="catBadge">—</div>
    <div class="hint-text" id="hintText"></div>
    <div class="lives-bar" id="livesBar"></div>
    <div class="word-display" id="wordDisplay"></div>
    <div class="status-msg" id="statusMsg"></div>
    <div class="alpha-grid" id="alphaGrid"></div>
    <button class="btn" onclick="newGame()" style="width:100%;margin-top:8px;">NEW WORD</button>
  </div>
</div>

<script src="../js/cursor.js"></script>
<script>
const WORDS = {
  tech: [
    {w:'ALGORITHM',  h:'Step-by-step problem-solving procedure'},
    {w:'COMPILER',   h:'Translates code to machine language'},
    {w:'RECURSION',  h:'A function that calls itself'},
    {w:'BANDWIDTH',  h:'Data transfer capacity'},
    {w:'ENCRYPTION', h:'Securing data with a cipher'},
    {w:'TRANSISTOR', h:'Fundamental building block of chips'},
    {w:'LATENCY',    h:'Delay in data transmission'},
    {w:'KERNEL',     h:'Core of an operating system'},
  ],
  animals: [
    {w:'AXOLOTL',    h:'Aquatic salamander that regenerates limbs'},
    {w:'PLATYPUS',   h:'Egg-laying mammal with a duck bill'},
    {w:'NARWHAL',    h:'Arctic whale with a long spiral horn'},
    {w:'PANGOLIN',   h:'Scaly mammal that rolls into a ball'},
    {w:'OKAPI',      h:'Forest giraffe with zebra-striped legs'},
    {w:'WOMBAT',     h:'Australian marsupial, cube-shaped poop'},
    {w:'QUOKKA',     h:'Smiling marsupial from Rottnest Island'},
  ],
  space: [
    {w:'NEBULA',     h:'Interstellar cloud of gas and dust'},
    {w:'PULSAR',     h:'Rapidly rotating neutron star'},
    {w:'QUASAR',     h:'Extremely luminous active galactic nucleus'},
    {w:'MAGNETAR',   h:'Neutron star with extreme magnetic field'},
    {w:'PERIHELION', h:'Closest point to the Sun in an orbit'},
    {w:'APHELION',   h:'Farthest point from the Sun in an orbit'},
    {w:'SINGULARITY',h:'Point of infinite density in a black hole'},
  ],
};

// Flatten for random
const ALL = Object.values(WORDS).flat();

let word, guessed, wrong, maxWrong, category, gameOver;
maxWrong = 6;
let currentCat = 'random';

function newGame(cat) {
  if(cat) currentCat = cat;
  const pool = currentCat==='random' ? ALL : (WORDS[currentCat]||ALL);
  const pick = pool[Math.floor(Math.random()*pool.length)];
  word = pick.w;
  guessed = new Set();
  wrong = 0;
  gameOver = false;

  document.getElementById('catBadge').textContent = currentCat.toUpperCase();
  document.getElementById('hintText').textContent = '💡 '+pick.h;
  document.getElementById('statusMsg').textContent = '';
  document.getElementById('statusMsg').className = 'status-msg';

  // Reset gallows
  for(let i=0;i<6;i++) document.getElementById('p'+i).classList.remove('show');

  renderLives();
  renderWord();
  renderAlpha();
}

function guess(letter) {
  if(gameOver||guessed.has(letter)) return;
  guessed.add(letter);

  if(!word.includes(letter)){
    wrong++;
    document.getElementById('p'+(wrong-1)).classList.add('show');
  }

  renderLives();
  renderWord();

  // Win?
  if([...word].every(l=>guessed.has(l)||l===' ')){
    gameOver=true;
    const msg=document.getElementById('statusMsg');
    msg.textContent='YOU WIN! 🎉';
    msg.className='status-msg win';
  }
  // Lose?
  else if(wrong>=maxWrong){
    gameOver=true;
    const msg=document.getElementById('statusMsg');
    msg.textContent=`GAME OVER — "${word}"`;
    msg.className='status-msg lose';
    // Reveal word
    renderWord(true);
  }

  renderAlpha();
}

function renderWord(reveal=false) {
  const el=document.getElementById('wordDisplay');
  el.innerHTML=[...word].map(l=>{
    if(l===' ') return '<div class="letter-slot space"></div>';
    const shown=guessed.has(l)||reveal;
    return `<div class="letter-slot">${shown?l:''}</div>`;
  }).join('');
}

function renderAlpha() {
  const el=document.getElementById('alphaGrid');
  el.innerHTML='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`
    <button class="alpha-btn ${guessed.has(l)?(word.includes(l)?'correct':'wrong'):''}"
      onclick="guess('${l}')"
      ${guessed.has(l)||gameOver?'disabled':''}>
      ${l}
    </button>`).join('');
}

function renderLives() {
  const el=document.getElementById('livesBar');
  el.innerHTML=Array.from({length:maxWrong},(_,i)=>
    `<div class="life-dot${i>=maxWrong-wrong?' lost':''}"></div>`
  ).join('');
}

// Keyboard support
document.addEventListener('keydown',e=>{
  if(e.key.match(/^[a-zA-Z]$/)&&!gameOver) guess(e.key.toUpperCase());
});

newGame('random');
</script>
</body>
</html>
