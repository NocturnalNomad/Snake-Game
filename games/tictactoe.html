<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Tic Tac Toe — Nocturnal Nomad</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/cursor.css"/>
  <style>
    body { display:flex; flex-direction:column; align-items:center; }
    .ttt-wrap { max-width: 420px; width:100%; margin-top:20px; }

    .mode-row { display:flex; gap:10px; justify-content:center; margin-bottom:20px; }

    #board {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .ttt-cell {
      aspect-ratio: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      cursor: none;
      transition: all 0.2s;
      user-select: none;
    }
    .ttt-cell:hover:not(.taken) {
      border-color: var(--cyan);
      background: rgba(0,255,255,0.06);
      box-shadow: 0 0 14px rgba(0,255,255,0.12);
    }
    .ttt-cell.x { color: var(--cyan); text-shadow: 0 0 14px var(--cyan); }
    .ttt-cell.o { color: var(--magenta); text-shadow: 0 0 14px var(--magenta); }
    .ttt-cell.win-cell {
      border-color: var(--green);
      background: rgba(0,255,136,0.1);
      box-shadow: 0 0 20px rgba(0,255,136,0.2);
    }

    .status {
      text-align: center;
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      letter-spacing: 3px;
      color: var(--cyan);
      margin-bottom: 16px;
      min-height: 24px;
      text-shadow: 0 0 10px var(--cyan);
    }

    .score-board {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
      margin-bottom: 20px;
    }
    .score-cell {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .score-cell .lbl { font-family:'Orbitron',monospace; font-size:0.55rem; letter-spacing:3px; color:var(--dim); }
    .score-cell .val { font-family:'Orbitron',monospace; font-size:1.4rem; margin-top:4px; }
    .score-cell.x-cell .val { color:var(--cyan); text-shadow:0 0 8px var(--cyan); }
    .score-cell.o-cell .val { color:var(--magenta); text-shadow:0 0 8px var(--magenta); }
    .score-cell.d-cell .val { color:var(--dim); }
  </style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo">NOCTURNAL<span style="color:#fff;opacity:0.4">_</span>NOMAD</a>
  <ul class="nav-links">
    <li><a href="../index.html">Games</a></li>
    <li><a href="../projects.html">Projects</a></li>
    <li><a href="../contact.html">Contact</a></li>
  </ul>
</nav>

<div class="game-page">
  <div class="ttt-wrap">

    <div style="text-align:center;margin-bottom:16px;">
      <div class="section-heading" style="font-size:1.6rem;">TIC TAC <span>TOE</span></div>
    </div>

    <div class="mode-row">
      <button class="btn active" id="pvpBtn" onclick="setMode('pvp')">2 PLAYERS</button>
      <button class="btn" id="aiBtn" onclick="setMode('ai')">VS AI</button>
    </div>

    <div class="score-board">
      <div class="score-cell x-cell"><div class="lbl">X <span id="xLabel">YOU</span></div><div class="val" id="xScore">0</div></div>
      <div class="score-cell d-cell"><div class="lbl">DRAWS</div><div class="val" id="dScore">0</div></div>
      <div class="score-cell o-cell"><div class="lbl">O <span id="oLabel">P2</span></div><div class="val" id="oScore">0</div></div>
    </div>

    <div class="status" id="status">X's turn</div>
    <div id="board"></div>

    <button class="btn" onclick="resetGame()" style="width:100%;">NEW ROUND</button>
  </div>
</div>

<script src="../js/cursor.js"></script>
<script>
const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

let board, current, scores, mode, gameOver;
scores = {X:0,O:0,D:0};
mode = 'pvp';

function setMode(m) {
  mode = m;
  document.getElementById('pvpBtn').className = m==='pvp'?'btn primary':'btn';
  document.getElementById('aiBtn').className  = m==='ai' ?'btn primary':'btn';
  document.getElementById('oLabel').textContent = m==='ai'?'AI':'P2';
  resetGame();
}

function resetGame() {
  board = Array(9).fill('');
  current = 'X';
  gameOver = false;
  document.getElementById('status').textContent = "X's turn";
  renderBoard();
}

function renderBoard() {
  const el = document.getElementById('board');
  el.innerHTML = board.map((v,i)=>`
    <div class="ttt-cell ${v?v.toLowerCase():''} ${v?'taken':''}"
         onclick="play(${i})">
      ${v==='X'?'✕':v==='O'?'○':''}
    </div>`).join('');
}

function play(i) {
  if(gameOver || board[i]) return;
  board[i] = current;
  const win = checkWin();
  if(win){
    highlight(win);
    scores[current]++;
    updateScores();
    document.getElementById('status').textContent = `${current} WINS!`;
    gameOver = true;
    return;
  }
  if(board.every(v=>v)){
    scores.D++;
    updateScores();
    document.getElementById('status').textContent = 'DRAW!';
    gameOver = true;
    renderBoard();
    return;
  }
  current = current==='X'?'O':'X';
  document.getElementById('status').textContent = `${current}'s turn`;
  renderBoard();

  if(mode==='ai' && current==='O' && !gameOver){
    setTimeout(aiMove, 350);
  }
}

function aiMove() {
  const move = getBestMove();
  play(move);
}

function getBestMove() {
  // Try to win
  for(let i=0;i<9;i++) if(!board[i]){
    board[i]='O'; if(checkWin()) { board[i]=''; return i; } board[i]='';
  }
  // Block X
  for(let i=0;i<9;i++) if(!board[i]){
    board[i]='X'; if(checkWin()) { board[i]=''; return i; } board[i]='';
  }
  // Take center
  if(!board[4]) return 4;
  // Take corner
  const corners=[0,2,6,8].filter(i=>!board[i]);
  if(corners.length) return corners[Math.floor(Math.random()*corners.length)];
  // Any
  const empty=board.map((v,i)=>v?null:i).filter(v=>v!==null);
  return empty[Math.floor(Math.random()*empty.length)];
}

function checkWin() {
  for(const combo of WINS){
    const [a,b,c]=combo;
    if(board[a]&&board[a]===board[b]&&board[a]===board[c]) return combo;
  }
  return null;
}

function highlight(combo) {
  renderBoard();
  const cells = document.querySelectorAll('.ttt-cell');
  combo.forEach(i=>cells[i].classList.add('win-cell'));
}

function updateScores(){
  document.getElementById('xScore').textContent=scores.X;
  document.getElementById('oScore').textContent=scores.O;
  document.getElementById('dScore').textContent=scores.D;
}

resetGame();
</script>
</body>
</html>
