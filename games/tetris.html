<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Tetris — Nocturnal Nomad</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    body { display:flex; flex-direction:column; align-items:center; }
    .tetris-layout { display:flex; gap:24px; align-items:flex-start; margin-top:20px; }
    .side-panel { width:120px; }
    .panel-label { font-family:'Orbitron',monospace; font-size:0.55rem; letter-spacing:3px; color:var(--dim); text-transform:uppercase; margin-bottom:8px; }
    .panel-val { font-family:'Orbitron',monospace; font-size:1.4rem; color:var(--cyan); text-shadow:0 0 10px var(--cyan); }
    .next-canvas { border:1px solid var(--card-border); border-radius:6px; }
    #gameCanvas { display:block; }
  </style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo">NOCTURNAL<span style="color:#fff;opacity:0.4">_</span>NOMAD</a>
  <ul class="nav-links">
    <li><a href="../index.html">Games</a></li>
    <li><a href="../projects.html">Projects</a></li>
    <li><a href="../contact.html">Contact</a></li>
  </ul>
</nav>

<div class="game-page">
  <div class="tetris-layout">
    <div class="side-panel">
      <div class="panel-label">Score</div>
      <div class="panel-val" id="scoreEl">0</div>
      <br/>
      <div class="panel-label">Lines</div>
      <div class="panel-val" id="linesEl">0</div>
      <br/>
      <div class="panel-label">Level</div>
      <div class="panel-val" id="levelEl">1</div>
      <br/>
      <div class="panel-label">Best</div>
      <div class="panel-val" id="bestEl">0</div>
    </div>

    <div>
      <div class="game-wrapper">
        <canvas id="gameCanvas" width="200" height="400"></canvas>
        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">TETRIS</h2>
          <p id="overlayMsg">Clear lines to score</p>
          <button class="btn primary" onclick="startGame()">START</button>
        </div>
      </div>
      <div class="game-controls" style="margin-top:12px;">← → Move &nbsp;|&nbsp; ↑ Rotate &nbsp;|&nbsp; ↓ Drop</div>
    </div>

    <div class="side-panel">
      <div class="panel-label">Next</div>
      <canvas id="nextCanvas" class="next-canvas" width="80" height="80"></canvas>
    </div>
  </div>

  <div class="leaderboard" style="max-width:200px;">
    <div class="lb-title">🏆 Top Scores</div>
    <div id="leaderboard"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('nextCanvas');
const nCtx = nextCanvas.getContext('2d');

const COLS = 10, ROWS = 20, SZ = 20;

const COLORS = ['','#00ffff','#0040ff','#ff8000','#ffff00','#00ff44','#aa00ff','#ff0044'];

const SHAPES = [
  [],
  [[1,1,1,1]],
  [[2,0,0],[2,2,2]],
  [[0,0,3],[3,3,3]],
  [[4,4],[4,4]],
  [[0,5,5],[5,5,0]],
  [[0,6,0],[6,6,6]],
  [[7,7,0],[0,7,7]]
];

let board, current, currentX, currentY, nextPiece, score, lines, level, gameInterval, running;

function newBoard(){ return Array.from({length:ROWS},()=>Array(COLS).fill(0)); }

function randomPiece(){
  const id = Math.floor(Math.random()*7)+1;
  return { id, shape: SHAPES[id].map(r=>[...r]) };
}

function startGame(){
  board = newBoard();
  score = lines = 0;
  level = 1;
  nextPiece = randomPiece();
  spawnPiece();
  running = true;
  document.getElementById('overlay').style.display='none';
  if(gameInterval) clearInterval(gameInterval);
  gameInterval = setInterval(drop, speed());
  updateUI();
}

function speed(){ return Math.max(100, 600 - (level-1)*50); }

function spawnPiece(){
  current = nextPiece;
  nextPiece = randomPiece();
  currentX = Math.floor((COLS - current.shape[0].length)/2);
  currentY = 0;
  if(collides(current.shape,currentX,currentY)){ gameOver(); }
  drawNext();
}

function drop(){
  if(!collides(current.shape,currentX,currentY+1)){
    currentY++;
  } else {
    lock();
    const cleared = clearLines();
    lines += cleared;
    score += [0,100,300,500,800][cleared]*level;
    if(lines >= level*10){ level++; clearInterval(gameInterval); gameInterval=setInterval(drop,speed()); }
    updateUI();
    spawnPiece();
  }
  render();
}

function collides(shape,ox,oy){
  for(let r=0;r<shape.length;r++){
    for(let c=0;c<shape[r].length;c++){
      if(!shape[r][c]) continue;
      const nx=ox+c, ny=oy+r;
      if(nx<0||nx>=COLS||ny>=ROWS) return true;
      if(ny>=0 && board[ny][nx]) return true;
    }
  }
  return false;
}

function lock(){
  current.shape.forEach((row,r)=>{
    row.forEach((v,c)=>{
      if(v && currentY+r>=0) board[currentY+r][currentX+c]=current.id;
    });
  });
}

function clearLines(){
  let count=0;
  for(let r=ROWS-1;r>=0;r--){
    if(board[r].every(c=>c!==0)){
      board.splice(r,1);
      board.unshift(Array(COLS).fill(0));
      count++; r++;
    }
  }
  return count;
}

function rotate(shape){
  return shape[0].map((_,i)=>shape.map(r=>r[i]).reverse());
}

function updateUI(){
  document.getElementById('scoreEl').textContent=score;
  document.getElementById('linesEl').textContent=lines;
  document.getElementById('levelEl').textContent=level;
  const best=JSON.parse(localStorage.getItem('tetris_scores')||'[]')[0]||0;
  document.getElementById('bestEl').textContent=best;
}

function gameOver(){
  clearInterval(gameInterval);
  running=false;
  saveScore(score);
  document.getElementById('overlayTitle').textContent='GAME OVER';
  document.getElementById('overlayMsg').textContent='Score: '+score;
  document.getElementById('overlay').querySelector('button').textContent='PLAY AGAIN';
  document.getElementById('overlay').style.display='flex';
  renderLeaderboard();
}

function saveScore(s){
  let arr=JSON.parse(localStorage.getItem('tetris_scores')||'[]');
  arr.push(s); arr.sort((a,b)=>b-a); arr=arr.slice(0,5);
  localStorage.setItem('tetris_scores',JSON.stringify(arr));
}

function renderLeaderboard(){
  const arr=JSON.parse(localStorage.getItem('tetris_scores')||'[]');
  document.getElementById('leaderboard').innerHTML=arr.length
    ?arr.map((s,i)=>`<div class="lb-entry"><span class="lb-rank">#${i+1}</span><span class="lb-score">${s}</span></div>`).join('')
    :'<div class="lb-entry"><span class="lb-rank">No scores</span></div>';
}

function drawCell(context,x,y,id,size){
  if(!id) return;
  const col=COLORS[id];
  context.fillStyle=col;
  context.shadowColor=col;
  context.shadowBlur=8;
  context.fillRect(x*size+1,y*size+1,size-2,size-2);
  context.shadowBlur=0;
  context.strokeStyle='rgba(255,255,255,0.15)';
  context.lineWidth=0.5;
  context.strokeRect(x*size+1,y*size+1,size-2,size-2);
}

function render(){
  ctx.fillStyle='#050510';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // grid
  ctx.strokeStyle='rgba(0,255,255,0.04)';
  ctx.lineWidth=0.5;
  for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*SZ,0);ctx.lineTo(c*SZ,400);ctx.stroke();}
  for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*SZ);ctx.lineTo(200,r*SZ);ctx.stroke();}
  // board
  board.forEach((row,r)=>row.forEach((v,c)=>drawCell(ctx,c,r,v,SZ)));
  // ghost
  let ghostY=currentY;
  while(!collides(current.shape,currentX,ghostY+1)) ghostY++;
  current.shape.forEach((row,r)=>row.forEach((v,c)=>{
    if(!v) return;
    ctx.fillStyle='rgba(255,255,255,0.08)';
    ctx.fillRect((currentX+c)*SZ+1,(ghostY+r)*SZ+1,SZ-2,SZ-2);
  }));
  // current
  current.shape.forEach((row,r)=>row.forEach((v,c)=>{if(v)drawCell(ctx,currentX+c,currentY+r,v,SZ);}));
}

function drawNext(){
  nCtx.fillStyle='#050510';
  nCtx.fillRect(0,0,80,80);
  const s=nextPiece.shape;
  const ox=Math.floor((4-s[0].length)/2);
  const oy=Math.floor((4-s.length)/2);
  s.forEach((row,r)=>row.forEach((v,c)=>{if(v)drawCell(nCtx,ox+c,oy+r,v,20);}));
}

document.addEventListener('keydown',e=>{
  if(!running) return;
  if(e.key==='ArrowLeft'&&!collides(current.shape,currentX-1,currentY)) currentX--;
  else if(e.key==='ArrowRight'&&!collides(current.shape,currentX+1,currentY)) currentX++;
  else if(e.key==='ArrowDown'){ clearInterval(gameInterval); drop(); gameInterval=setInterval(drop,speed()); }
  else if(e.key==='ArrowUp'){
    const rot=rotate(current.shape);
    if(!collides(rot,currentX,currentY)) current.shape=rot;
  } else if(e.key===' '){
    while(!collides(current.shape,currentX,currentY+1)) currentY++;
    drop();
  } else return;
  e.preventDefault();
  render();
});

renderLeaderboard();
updateUI();
</script>
</body>
</html>
