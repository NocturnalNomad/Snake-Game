<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Contact — Nocturnal Nomad</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">NOCTURNAL<span style="color:#fff;opacity:0.4">_</span>NOMAD</a>
  <ul class="nav-links">
    <li><a href="index.html">Games</a></li>
    <li><a href="projects.html">Projects</a></li>
    <li><a href="contact.html" class="active">Contact</a></li>
  </ul>
</nav>

<div class="page">
  <div style="max-width:560px;margin:0 auto;">

    <div class="section-title fade-up">Get In Touch</div>
    <div class="section-heading fade-up">Send a <span>Message</span></div>

    <p class="fade-up stagger-1" style="color:var(--dim);margin-bottom:40px;font-size:0.95rem;line-height:1.7;letter-spacing:0.5px;">
      Found a bug? Have feedback on the games? Want to collaborate on a project?<br/>
      Drop a message — it goes straight to Akhil's inbox.
    </p>

    <form id="contactForm"
          action="https://formspree.io/f/mnjgwrqy"
          method="POST"
          class="fade-up stagger-2"
          onsubmit="handleSubmit(event)">

      <div class="form-group">
        <label for="name">Your Name</label>
        <input id="name" type="text" name="name" placeholder="Akhil Kudipudi" required/>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input id="email" type="email" name="email" placeholder="you@example.com" required/>
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input id="subject" type="text" name="subject" placeholder="Game feedback / Bug report / Collab"/>
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="What's on your mind..." required></textarea>
      </div>

      <button type="submit" class="btn primary" style="width:100%;font-size:0.75rem;">
        SEND MESSAGE
      </button>
    </form>

    <div class="form-success" id="successMsg">
      <div style="font-size:2rem;margin-bottom:16px;">✓</div>
      Message received! I'll get back to you soon.
    </div>

  </div>
</div>

<script>
function handleSubmit(e) {
  e.preventDefault();
  const form = document.getElementById('contactForm');
  const data = new FormData(form);

  fetch(form.action, {
    method: 'POST',
    body: data,
    headers: { 'Accept': 'application/json' }
  })
  .then(res => {
    if(res.ok) {
      form.style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } else {
      alert('Something went wrong. Please try again.');
    }
  })
  .catch(() => alert('Network error. Please check your connection.'));
}
</script>

</body>
</html>
