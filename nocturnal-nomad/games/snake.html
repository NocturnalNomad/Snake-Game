<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Hungry Snake — Nocturnal Nomad</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <style>
    body { display:flex; flex-direction:column; align-items:center; }
    #gameCanvas { display:block; }
    .back-link { position:fixed; top:80px; left:30px; font-family:'Orbitron',monospace; font-size:0.65rem; letter-spacing:2px; color:var(--dim); text-decoration:none; z-index:10; }
    .back-link:hover { color:var(--cyan); }
  </style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo">NOCTURNAL<span style="color:#fff;opacity:0.4">_</span>NOMAD</a>
  <ul class="nav-links">
    <li><a href="../index.html">Games</a></li>
    <li><a href="../projects.html">Projects</a></li>
    <li><a href="../contact.html">Contact</a></li>
  </ul>
</nav>

<div class="game-page">
  <div class="score-bar">
    <span class="score-label">SCORE</span>
    <span class="score-val" id="scoreDisplay">0</span>
    <span class="score-label">BEST</span>
    <span class="score-val" id="bestDisplay">0</span>
  </div>

  <div class="game-wrapper">
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">HUNGRY SNAKE</h2>
      <p id="overlayMsg">Use arrow keys to move</p>
      <button class="btn primary" onclick="startGame()">START GAME</button>
    </div>
  </div>

  <div class="game-controls">Arrow Keys / WASD to move</div>

  <div class="leaderboard">
    <div class="lb-title">🏆 Top Scores</div>
    <div id="leaderboard"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayMsg = document.getElementById('overlayMsg');
const scoreEl = document.getElementById('scoreDisplay');
const bestEl = document.getElementById('bestDisplay');

const BOX = 20;
const COLS = 20;
const ROWS = 20;

let snake, food, dir, nextDir, score, gameLoop, running;

function initSnake() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = 'RIGHT';
  nextDir = 'RIGHT';
  score = 0;
  scoreEl.textContent = '0';
  spawnFood();
}

function spawnFood() {
  let pos;
  do {
    pos = {
      x: Math.floor(Math.random()*COLS),
      y: Math.floor(Math.random()*ROWS)
    };
  } while (snake.some(s=>s.x===pos.x && s.y===pos.y));
  food = pos;
}

function startGame() {
  overlay.style.display = 'none';
  initSnake();
  running = true;
  if(gameLoop) clearInterval(gameLoop);
  gameLoop = setInterval(tick, 100);
  updateBest();
}

function tick() {
  dir = nextDir;
  const head = {x: snake[0].x, y: snake[0].y};
  if(dir==='LEFT')  head.x--;
  if(dir==='RIGHT') head.x++;
  if(dir==='UP')    head.y--;
  if(dir==='DOWN')  head.y++;

  // Wall collision
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS) { gameOver(); return; }
  // Self collision
  if(snake.some(s=>s.x===head.x&&s.y===head.y)) { gameOver(); return; }

  snake.unshift(head);

  if(head.x===food.x && head.y===food.y) {
    score += 10;
    scoreEl.textContent = score;
    spawnFood();
  } else {
    snake.pop();
  }

  draw();
}

function draw() {
  // Background
  ctx.fillStyle = '#050510';
  ctx.fillRect(0,0,400,400);

  // Grid
  ctx.strokeStyle = 'rgba(0,255,255,0.04)';
  ctx.lineWidth = 0.5;
  for(let i=0;i<=COLS;i++){
    ctx.beginPath(); ctx.moveTo(i*BOX,0); ctx.lineTo(i*BOX,400); ctx.stroke();
  }
  for(let j=0;j<=ROWS;j++){
    ctx.beginPath(); ctx.moveTo(0,j*BOX); ctx.lineTo(400,j*BOX); ctx.stroke();
  }

  // Food glow
  const fx = food.x*BOX+BOX/2;
  const fy = food.y*BOX+BOX/2;
  const grad = ctx.createRadialGradient(fx,fy,2,fx,fy,BOX);
  grad.addColorStop(0,'rgba(255,0,120,0.6)');
  grad.addColorStop(1,'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(food.x*BOX-BOX, food.y*BOX-BOX, BOX*3, BOX*3);
  ctx.fillStyle = '#ff0066';
  ctx.shadowColor = '#ff0066';
  ctx.shadowBlur = 12;
  ctx.fillRect(food.x*BOX+2, food.y*BOX+2, BOX-4, BOX-4);
  ctx.shadowBlur = 0;

  // Snake
  for(let i=0;i<snake.length;i++){
    const s = snake[i];
    const ratio = 1 - (i/snake.length)*0.6;
    if(i===0){
      ctx.fillStyle = '#00ffff';
      ctx.shadowColor = '#00ffff';
      ctx.shadowBlur = 16;
    } else {
      const r = Math.round(0*ratio);
      const g = Math.round(255*ratio);
      const b = Math.round(180*ratio);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.shadowColor = `rgb(${r},${g},${b})`;
      ctx.shadowBlur = 6;
    }
    ctx.fillRect(s.x*BOX+1, s.y*BOX+1, BOX-2, BOX-2);
  }
  ctx.shadowBlur = 0;
}

function gameOver() {
  clearInterval(gameLoop);
  running = false;
  saveScore(score);
  overlayTitle.textContent = 'GAME OVER';
  overlayMsg.textContent = `Score: ${score}`;
  overlay.querySelector('button').textContent = 'PLAY AGAIN';
  overlay.style.display = 'flex';
  renderLeaderboard();
  updateBest();
}

function saveScore(s) {
  let scores = JSON.parse(localStorage.getItem('snake_scores')||'[]');
  scores.push(s);
  scores.sort((a,b)=>b-a);
  scores = scores.slice(0,5);
  localStorage.setItem('snake_scores', JSON.stringify(scores));
}

function updateBest() {
  const scores = JSON.parse(localStorage.getItem('snake_scores')||'[]');
  bestEl.textContent = scores[0] || 0;
}

function renderLeaderboard() {
  const scores = JSON.parse(localStorage.getItem('snake_scores')||'[]');
  const el = document.getElementById('leaderboard');
  el.innerHTML = scores.length
    ? scores.map((s,i)=>`
        <div class="lb-entry">
          <span class="lb-rank">#${i+1}</span>
          <span class="lb-score">${s}</span>
        </div>`).join('')
    : '<div class="lb-entry"><span class="lb-rank">No scores yet</span></div>';
}

document.addEventListener('keydown', e => {
  const map = {
    ArrowLeft:'LEFT', a:'LEFT', A:'LEFT',
    ArrowRight:'RIGHT', d:'RIGHT', D:'RIGHT',
    ArrowUp:'UP', w:'UP', W:'UP',
    ArrowDown:'DOWN', s:'DOWN', S:'DOWN'
  };
  const d = map[e.key];
  if(!d) return;
  const opp = {LEFT:'RIGHT',RIGHT:'LEFT',UP:'DOWN',DOWN:'UP'};
  if(d !== opp[dir]) nextDir = d;
  e.preventDefault();
});

renderLeaderboard();
updateBest();
</script>
</body>
</html>
